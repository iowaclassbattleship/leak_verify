# nginx in front of the demonstrator on one EC2 instance, with certbot for TLS.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/attribution
#   sudo ln -s /etc/nginx/sites-available/attribution /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d demo.northward.ch
#
# certbot rewrites this file to add the listen 443 block and the certificate
# paths, and leaves everything below untouched.

server {
    listen 80;
    server_name demo.northward.ch;

    # Uploads are capped at 25 MB by the application. nginx defaults to 1 MB
    # and would reject a large PDF or CSV with its own 413 before the
    # application ever sees it.
    client_max_body_size 25m;

    # Marking a large document for several recipients takes a few seconds.
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Overwrite rather than append. The application takes the first value
        # for its sign-in throttle and its action log, so an appended header
        # would let a caller put any address they liked in front of their own.
        proxy_set_header X-Forwarded-For   $remote_addr;
    }
}
