<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23ffffff%27/%3E%3Cpath d=%27M8 1l7 7-7 7-7-7z%27 fill=%27%23000000%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/base.css">
  <style>
    .signin { max-width: 340px; margin: 18vh auto 0; }
    .signin img { height: 22px; display: block; margin-bottom: 28px; }
    .signin h1 { font-size: 20px; margin-bottom: 4px; }
    .signin form { margin-top: 24px; display: flex; flex-direction: column; gap: 18px; }
    .signin input { font-size: 15px; padding: 8px 2px; }
    .signin button { align-self: flex-start; }
    .signin .error { color: var(--bad); font-size: 13px; }
    .signin label { display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>
  <div class="signin">
    <img src="/shared/northward.png" alt="northward">
    <form method="post" action="/login">
      <label>
        <span class="muted small">Email</span>
        <input type="email" name="email" autocomplete="username" autofocus required>
      </label>
      <label>
        <span class="muted small">Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="error" hidden>That email address and password were not accepted.</p>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).has('error')) document.getElementById('error').hidden = false;
  </script>
</body>
</html>
