services:
  attribution:
    build:
      context: .
      # Stamps the binary with the commit, shown at /healthz and on the pages:
      #   BUILD=$(git rev-parse --short HEAD) docker compose up --build
      args:
        BUILD: ${BUILD:-}
    ports:
      # Bound to loopback: nginx is the only way in, even if the security
      # group is ever opened wider than 80 and 443.
      - "127.0.0.1:8080:8080"
    volumes:
      # The sign-in list. Copy config.example.yaml to config.yaml and edit it.
      - ./config.yaml:/app/config.yaml:ro
      # Issuance logs, so a copy issued before a restart can still be named.
      # Marked files and keys are not written here.
      - attribution-data:/app/data
    environment:
      # The session cookie is only sent over HTTPS. Set to 0 only when
      # running locally without a TLS proxy in front.
      SECURE_COOKIE: ${SECURE_COOKIE:-1}
    restart: unless-stopped

volumes:
  attribution-data:
